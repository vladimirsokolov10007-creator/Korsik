name: Verify Korsik bot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Syntax and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Test API behaviour
        run: PYTHONPATH=backend pytest -q backend/tests
      - name: Check browser script syntax
        run: node --check backend/app/static/app.js
